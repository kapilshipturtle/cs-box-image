name: build cs-render
on:
  push: { branches: [main], paths: [Dockerfile.render, setup/remote-setup.sh, setup/font-packages.txt, .github/workflows/build-render.yml] }
  workflow_dispatch: {}
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile.render, push: true, tags: "ghcr.io/kapilshipturtle/cs-render:latest,ghcr.io/kapilshipturtle/cs-render:20261014b" }
